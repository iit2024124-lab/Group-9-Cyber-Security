<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Discussion Forum{% endblock %} | {{ build_label }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {# Coloured banner so screenshots clearly show which build is running. #}
  <div class="build-banner {{ build_class }}">{{ build_label }} &mdash; {{ build_note }}</div>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">DevTalk &middot; Developer Community</a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container footer">
    DevTalk is a fictional demo site for a Stored XSS (Variant 1) security exercise. Run on localhost only.
  </footer>
</body>
</html>
