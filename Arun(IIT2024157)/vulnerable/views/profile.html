<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Profile - Vulnerable App</title>
<style>
 body{font-family:Arial,sans-serif;padding:40px;transition:.2s}
 body.light{background:#ffffff;color:#222}
 body.dark{background:#1e1e1e;color:#eee}
 .card{border:1px solid #888;padding:24px;border-radius:8px;max-width:420px}
 a.btn{display:inline-block;padding:8px 16px;margin-right:8px;border-radius:4px;text-decoration:none;background:#c0392b;color:#fff}
 .tag{background:#c0392b;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px}
 code{background:#8883;padding:2px 6px;border-radius:3px}
</style></head>
<body class="{{theme}}"><div class="card">
<h2>Profile <span class="tag">VULNERABLE (GET)</span></h2>
<p>Logged in as <b>{{user}}</b></p>
<p>Current theme: <b>{{theme}}</b></p>
<p>Change theme (uses GET):</p>
<a class="btn" href="/profile/theme?value=light">Light</a>
<a class="btn" href="/profile/theme?value=dark">Dark</a>
<p style="margin-top:20px;font-size:13px">Request used: <code>GET /profile/theme?value=dark</code></p>
<p><a href="/logout">Log out</a></p>
</div></body></html>
