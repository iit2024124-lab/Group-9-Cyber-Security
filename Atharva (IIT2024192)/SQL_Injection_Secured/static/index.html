<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison — My account</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/">maison<span>®</span></a></header>
<main><section class="story"><div><span class="eyebrow">LESS, BUT BETTER.</span><h1>A little comfort.<br>Every single day.</h1><p>Thoughtful essentials for a home<br>that feels like you.</p></div><div class="still-life" aria-hidden="true"><div class="sun"></div><div class="table"></div><div class="vase"><div class="stem one"></div><div class="stem two"></div><div class="leaf one"></div><div class="leaf two"></div></div><div class="cup"></div><div class="book"></div></div></section>
<section class="account"><div id="login-panel"><span class="eyebrow">YOUR LITTLE CORNER</span><h2>Welcome back.</h2><p class="subtitle">Sign in to view your account and orders.</p><form id="login-form"><label for="username">Username</label><input id="username" name="username" autocomplete="off" spellcheck="false" maxlength="256" placeholder="Enter your username" required><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="off" maxlength="256" placeholder="Enter your password" required><button type="button" id="show-password" aria-label="Show password">Show</button></div><p id="error" role="alert" hidden></p><button class="primary" id="submit" type="submit">Sign in <span>→</span></button></form></div>
<div id="profile" hidden><h2>Hello, <span id="name"></span>.</h2><p class="subtitle">Make yourself at home.</p><div class="account-card"><span class="eyebrow">ACCOUNT DETAILS</span><dl><div><dt>Username</dt><dd id="account-name"></dd></div><div><dt>Email</dt><dd id="account-email"></dd></div></dl></div><div class="orders"><h3>Your orders</h3><p>You have no orders yet.</p></div><button id="logout" class="primary" type="button">Sign out <span>↗</span></button></div></section></main></body></html>
